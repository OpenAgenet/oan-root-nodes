[server]
host = "127.0.0.1"
port = 8000
endpoint = "http://localhost:8000"

[cors]
allowed_origins = [
  "http://localhost:5173",
  "http://127.0.0.1:5173",
  "https://openagenet.github.io",
  "https://openagenet.github.io/oan-site",
]


[security.admin]
mode = "static-token"
static_tokens = ["local-dev-admin-token"]

[security.trust_indexer]
enabled = true
endpoint = "http://127.0.0.1:8088"
fail_mode = "closed"
timeout_ms = 500
poll_interval_ms = 3000

[events]
enabled = true
backend = "nats-jetstream"
endpoint = "nats://127.0.0.1:4222"
stream = "OAN_RESOURCE_PUBLICATION"
cdn_publish_subject = "oan.resource.cdn.publish.requested"
publish_timeout_ms = 1000
failure_mode = "closed"

[paths]
data_dir = "../../data/root"
identity_file = "../../data/root/identity.json"
bulletin_file = "../../data/root/bulletin.json"
controller_authorization_nonce_file = "../../data/root/controller-authorization-nonces.json"
capability_tree_file = "../../docs/capability-tree-v1.json"
database_url = "postgres://postgres:postgres@127.0.0.1:5432/oan_root"

# Optional runtime overrides; omitted values preserve the previous node defaults.
[runtime.tokio]
thread_stack_size_mib = 8

[runtime.did_verification]
worker_count = 6
queue_capacity = 12
worker_stack_size_mib = 16

# Backend-specific defaults: PostgreSQL 8 connections; SQLite 32; acquire timeout 30s.
# [database.pool]
# max_connections = 8
# acquire_timeout_seconds = 30
